spring:
  application:
   name: ruby-ai-agent
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.ruby.rubyaiagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

