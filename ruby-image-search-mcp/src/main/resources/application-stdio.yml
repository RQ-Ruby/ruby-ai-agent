spring:
  application:
    name: yu-image-search-mcp-server
  ai:
    mcp:
      server:
        name: yu-image-search-mcp-server
        version: 0.0.1
        type: SYNC
        # stdio
        stdio: true
  # stdio
  main:
    web-application-type: none
    banner-mode: off

# 完全禁用日志输出到 stdout（MCP stdio 模式要求）
logging:
  pattern:
    console: ""
  level:
    root: OFF
